name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: OpenSCAD compatibility (text)
        run: |
          cargo build -p scadr
          cargo run -p compat-runner

      - name: OpenSCAD compatibility (params)
        run: cargo run -p compat-runner -- --params

      # One known geometric difference (lex_scale_vector): reported, not blocking.
      - name: OpenSCAD compatibility (geometry)
        continue-on-error: true
        run: cargo run -p compat-runner -- --geometry

  # The 3D viewer and the engine crates that already build for WebAssembly
  # (everything but the Manifold kernel and what depends on it: see docs/web.md).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (wasm32)
        run: >
          cargo clippy --target wasm32-unknown-unknown
          -p scad-syntax -p scad-eval -p scad-customizer -p scad-font
          -p geometry -p mesh-io -p render -p viewer -p web-viewer
          -- -D warnings

      - name: Build the web viewer
        run: cargo build --release --target wasm32-unknown-unknown -p web-viewer
